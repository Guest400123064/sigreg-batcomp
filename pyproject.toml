[project]
name = "batcomp"
dynamic = ["version"]
description = "Batch composition for temporal SSL with SIGReg."
requires-python = ">=3.10"
authors = [{ name = "guest400123064", email = "wangy49@engineering.upenn.edu" }]
packages = [{ include = "batcomp", from = "src" }]
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "just-config-mixin>=0.1.1",
    "tensorblob>=0.3.0",
    "tensorboard>=2.21.0",
    "trackio>=0.34.0",
    "x-transformers>=2.25.4",
]

[dependency-groups]
dev = [
    "lancedb>=0.36.0",
    "bpython>=0.26",
    "bump-my-version>=0.30.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/batcomp/__init__.py"
