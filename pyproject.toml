[project]
name = "tseprobe"
dynamic = ["version"]
description = "Probing what LeJEPA-style time series embeddings contain."
requires-python = ">=3.10"
authors = [
    {name = "guest400123064", email = "wangy49@seas.upenn.edu"}
]
packages = [{include = "tseprobe", from = "src"}]
dependencies = [
    "just-config-mixin>=0.1.1",
    "lancedb>=0.36.0",
    "tensorblob>=0.3.0",
    "tensorboard>=2.21.0",
    "trackio>=0.34.0",
    "x-transformers>=2.25.4",
]

[dependency-groups]
dev = [
    "bpython>=0.26",
    "bump-my-version>=0.30.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tseprobe/__init__.py"
